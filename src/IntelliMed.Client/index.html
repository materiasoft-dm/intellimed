<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10b981" />
    <title>IntelliMed</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
        /* Shown until the app's first render replaces #app — kept inline so it paints before any bundle loads. */
        #app:has(.imed-splash) { height: 100vh; width: 100vw; }
        .imed-splash {
            height: 100%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 1.25rem; background: linear-gradient(160deg, #f9f9f8 0%, #e6f8f0 55%, #d1f2e3 100%);
            font-family: 'Inter Variable', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        .imed-splash-mark { position: relative; width: 88px; height: 88px; display: flex; align-items: center; justify-content: center; }
        .imed-splash-ring {
            position: absolute; inset: 0; border-radius: 50%; border: 4px solid rgba(16, 185, 129, 0.15);
            border-top-color: #10b981; border-right-color: #059669; animation: imed-spin 0.9s linear infinite;
        }
        .imed-splash-logo {
            width: 60px; height: 60px; border-radius: 16px; background: linear-gradient(135deg, #10b981, #047857); color: #fff;
            font-weight: 700; font-size: 1.35rem; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 24px rgba(5, 150, 105, 0.28); animation: imed-pulse 1.6s ease-in-out infinite;
        }
        .imed-splash-title { margin: 0; font-size: 1.5rem; font-weight: 700; color: #1a1a1a; letter-spacing: 0.2px; }
        .imed-splash-status { margin: 0; font-size: 0.9rem; color: #6c757d; display: flex; align-items: baseline; gap: 2px; }
        .imed-splash-dots span { animation: imed-dot-fade 1.4s infinite; opacity: 0; }
        .imed-splash-dots span:nth-child(2) { animation-delay: 0.2s; }
        .imed-splash-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes imed-spin { to { transform: rotate(360deg); } }
        @keyframes imed-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        @keyframes imed-dot-fade { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
            .imed-splash-ring, .imed-splash-logo, .imed-splash-dots span { animation: none; opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="imed-splash">
            <div class="imed-splash-mark">
                <span class="imed-splash-ring"></span>
                <span class="imed-splash-logo">IM</span>
            </div>
            <h1 class="imed-splash-title">IntelliMed</h1>
            <p class="imed-splash-status">Starting up<span class="imed-splash-dots"><span>.</span><span>.</span><span>.</span></span></p>
        </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
