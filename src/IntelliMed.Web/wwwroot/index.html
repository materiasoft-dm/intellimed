<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IntelliMed</title>
    <base href="/" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
    <link href="_content/Radzen.Blazor/css/material-base.css" rel="stylesheet" />
    <style>
        #app:has(.imed-splash) {
            height: 100vh;
            width: 100vw;
        }
        .imed-splash {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            background: linear-gradient(160deg, #f5f7fa 0%, #eaf0fc 55%, #dce8fb 100%);
            font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        .imed-splash-mark {
            position: relative;
            width: 88px;
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .imed-splash-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 4px solid rgba(66, 114, 215, 0.15);
            border-top-color: #4272d7;
            border-right-color: #2f5bc4;
            animation: imed-spin 0.9s linear infinite;
        }
        .imed-splash-logo {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: linear-gradient(135deg, #4272d7, #085041);
            color: #fff;
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 24px rgba(47, 91, 196, 0.28);
            animation: imed-pulse 1.6s ease-in-out infinite;
        }
        .imed-splash-title {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: 0.2px;
        }
        .imed-splash-status {
            margin: 0;
            font-size: 0.9rem;
            color: #6c757d;
            display: flex;
            align-items: baseline;
            gap: 2px;
        }
        .imed-splash-dots span {
            animation: imed-dot-fade 1.4s infinite;
            opacity: 0;
        }
        .imed-splash-dots span:nth-child(1) { animation-delay: 0s; }
        .imed-splash-dots span:nth-child(2) { animation-delay: 0.2s; }
        .imed-splash-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes imed-spin {
            to { transform: rotate(360deg); }
        }
        @keyframes imed-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        @keyframes imed-dot-fade {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="imed-splash">
            <div class="imed-splash-mark">
                <span class="imed-splash-ring"></span>
                <span class="imed-splash-logo">IM</span>
            </div>
            <h1 class="imed-splash-title">IntelliMed</h1>
            <p class="imed-splash-status">Starting up<span class="imed-splash-dots"><span>.</span><span>.</span><span>.</span></span></p>
        </div>
    </div>
    <script>
        window.BlazorTheme = {
            setTheme: function (theme) {
                document.body.className = theme;
            }
        };
    </script>
    <script>
        // Ensure Bootstrap CSS is loaded even after Blazor head manipulation
        (function() {
            if (!document.querySelector('link[href*="bootstrap"]')) {
                var link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css';
                document.head.appendChild(link);
            }
            // Also observe for head changes and re-add if removed
            var observer = new MutationObserver(function() {
                if (!document.querySelector('link[href*="bootstrap.min.css"]')) {
                    var link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css';
                    document.head.appendChild(link);
                }
                if (!document.querySelector('link[href*="bootstrap-icons"]')) {
                    var link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = 'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css';
                    document.head.appendChild(link);
                }
            });
            observer.observe(document.head, { childList: true });
        })();
    </script>
    <script type="module">
        import { Grid, h } from 'https://cdn.jsdelivr.net/npm/gridjs@6.1.1/dist/gridjs.module.js';
        window.gridjs = { Grid, h };
    </script>
    <script src="js/gridjs-interop.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="js/chart-interop.js"></script>
    <script src="js/command-palette.js"></script>
    <script src="js/download-interop.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
